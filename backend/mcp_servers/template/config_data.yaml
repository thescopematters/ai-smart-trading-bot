# DATA TOOLS HARNESS — market_analyst_agent + supervisor
# 5 read-only public data tools. No user_id required.

client:
  name: "default-data"
  database_url: ""

api_keys:
  coinmarketcap: ""
  cryptopanic: ""
  coinmarketcap_url: ""
  cryptopanic_url: ""
  blockchair_url: "https://api.blockchair.com"

limits:
  rate_limit_per_minute: 30
  trade_history_default: 20

risk:
  max_order_usd: 10000
  max_daily_loss_usd: 500
  max_portfolio_exposure: 0.30

tools_enabled:
  - get_live_price
  - get_trending_news
  - get_blockchain_stats
  - get_market_analysis
  - query_knowledge_base
